{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="px-4 py-5 my-5 text-center">
    <img src="{% static 'images/favicon.png' %}" alt="Library Logo" width="72" height="57" class="me-2">
    <h1 class="display-5 fw-bold text-body-emphasis">Library</h1>
    <div class="col-lg-6 mx-auto">
        <p class="lead mb-4">Explore our extensive collection of literature, manage your borrowed books,
            and discover new authors in just a few clicks.</p>
        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a href="{% url 'book:book_list' %}" class="btn btn-primary btn-lg px-4 gap-3">
                <i class="bi bi-book me-2"></i>Browse Catalog
            </a>
        </div>
    </div>
</div>
{% endblock %}
