{% load static %}

<header
    class="container d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
    <div class="col-md-3 mb-2 mb-md-0">
        <a href="{% url 'home' %}" class="d-inline-flex link-body-emphasis text-decoration-none">
            <img src="{% static 'images/favicon.png' %}" alt="Library Logo" width="40" height="32" class="me-2">
            <span class="fs-4">Library</span>
        </a>
    </div>
    <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
        {% if user.is_staff %}
        <li class="nav-item dropdown">
            <button type="button" class="nav-link dropdown-toggle px-2" data-bs-toggle="dropdown"
                aria-expanded="false">User
                Management</button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="{% url 'authentication:show_user' %}">My Profile</a></li>
                <li>
                    <hr class="dropdown-divider">
                </li>
                <li><a class="dropdown-item" href="{% url 'authentication:show_users' %}">All Users</a></li>
                <li><a class="dropdown-item" href="{% url 'admin:index' %}">Admin Panel</a></li>
            </ul>
        </li>
        {% else %}
        <li><a href="{% url 'authentication:show_user' %}" class="nav-link px-2">Profile</a></li>
        {% endif %}
        <li><a href="{% url 'book:all_books' %}" class="nav-link px-2">Books</a></li>
        <li><a href="{% url 'author:all_authors' %}" class="nav-link px-2">Authors</a></li>
        <li><a href="{% url 'order:all_orders' %}" class="nav-link px-2">Orders</a></li>
    </ul>
    <div class="col-md-3 text-end"> {% if not user.is_authenticated %}
        <a href="{% url 'authentication:login' %}" class="btn btn-outline-primary me-2">Log-in</a>
        <a href="{% url 'authentication:register' %}" class="btn btn-primary">Sign-up</a>
        {% else %}
        <form method="post" action="{% url 'authentication:logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary">
                Log out
            </button>
        </form>
        {% endif %}
    </div>
</header>
