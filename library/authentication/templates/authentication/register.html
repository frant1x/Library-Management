{% extends "base.html" %}

{% block title %}Registration{% endblock %}

{% block content %}
<main class="form-signin" style="max-width: 330px; margin: auto">
  <form method="post" x-data="{ submitting: false }" @submit="submitting = true">
    {% csrf_token %}
    <h1 class="h3 mb-3 fw-normal">Please sign up</h1>

    {% for field in form %}
    <div class="form-floating">
      {{ field }}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {% if field.errors %}
      <div class="invalid-feedback d-block">
        {% for error in field.errors %}
        <div>{{ error }}</div>
        {% endfor %}
      </div>
      {% endif %}
    </div>
    {% endfor %}

    <button class="w-100 mt-3 btn btn-lg btn-primary" type="submit" :disabled="submitting">
      <span x-show="!submitting">Sign up</span>
      <span x-show="submitting" x-cloak>
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        Creating account...
      </span>
    </button>
  </form>
</main>
{% endblock %}
